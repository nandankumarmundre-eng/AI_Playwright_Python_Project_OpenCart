name: Smoke tests

on:
  workflow_dispatch:
  push:
    paths:
      - "config/**"
      - "constants/**"
      - "conftest.py"
      - "data/**"
      - "fixtures/**"
      - "pages/**"
      - "requirements.txt"
      - "tests/smoke/**"
      - "utils/**"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests/smoke -m smoke --headless
