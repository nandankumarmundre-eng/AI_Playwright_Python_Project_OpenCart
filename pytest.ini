[pytest]

# ==========================================
# pytest.ini - Pytest Configuration File
# ==========================================

testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts =
    # ------------------------------
    # General Options
    # ------------------------------
    -v
    -ra
    --strict-markers
    # The project defines its own browser, page, and base URL fixtures/options.
    -p no:playwright
    -p no:base_url
    --browser=chromium
    --headed

    # ------------------------------
    # Captures and Reports
    # ------------------------------
    # Screenshots and traces are retained on failure. WebM videos are saved
    # under reports/evidence/videos by the shared browser_context fixture.
    --html=reports/html/pytest_html_report.html
    --self-contained-html
    --capture=tee-sys
    --alluredir=reports/allure-results

    # ------------------------------
    # Parallel Execution
    # ------------------------------
    # -n=2
    # --numprocesses=2

    # ------------------------------
    # Test Grouping
    # Pytest accepts one active -m expression; CLI -m overrides this default.
    # ------------------------------
    -m "sanity"
    -m "regression"
    -m "sanity or regression"
    -m "sanity and regression"
    -m "smoke"
    -m "e2e"
    # -m "sanity and not regression"
    # -m "regression and not sanity"
    

    # ------------------------------
    # Flaky Test Handling
    # ------------------------------
    --reruns=1
    --reruns-delay=2

markers =
    smoke: fast checks of critical storefront entry points
    e2e: end-to-end user workflows
    regression: broader UI regression coverage
    sanity: essential checks for basic application health
    datadriven: data-driven test cases
    end_to_end: end-to-end test workflows
    api: API test cases

# Values consumed by the project fixtures when no CLI option is supplied.
base_url = https://tutorialsninja.com/demo/
browser = chromium
headed = true
